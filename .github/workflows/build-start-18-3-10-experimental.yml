name: Build MINEVORA 18.3.10 Start Glow Experimental
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_start_18_3_10.py'
      - 'tools/build_play_18_3_9.py'
      - 'tools/build_services_18_3_8.py'
      - 'tests/test_start_18_3_10.py'
      - '.github/workflows/build-start-18-3-10-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-glow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original PLAY and new Start UI contracts
        run: |
          python -m unittest discover -s tests -p 'test_play_18_3_9.py' -v
          python -m unittest discover -s tests -p 'test_start_18_3_10.py' -v
          python -m py_compile tools/build_play_18_3_9.py tools/build_start_18_3_10.py
      - name: Download and check archived v18.3.7 launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input dist
          gh release download v18.3.7 --repo "${{ github.repository }}" --pattern 'MINEVORA_LAUNCHER_18_3_7_NEON_DESKTOP.zip' --dir input
          gh release download v18.3.7 --repo "${{ github.repository }}" --pattern 'MINEVORA_LAUNCHER_18_3_7_NEON_DESKTOP.zip.sha256' --dir input
          (cd input && sha256sum -c MINEVORA_LAUNCHER_18_3_7_NEON_DESKTOP.zip.sha256)
      - name: Build unchanged 18.3.9 PLAY base and 18.3.10 Start Glow variant
        run: |
          python tools/build_play_18_3_9.py
          python tools/build_start_18_3_10.py
          (cd dist && sha256sum -c MINEVORA_LAUNCHER_18_3_10_START_GLOW_EXPERIMENTAL.zip.sha256)
          python - <<'PY'
          from zipfile import ZipFile
          import ast
          root='MINEVORA_18_3_ENCHANTED/'
          old='dist/MINEVORA_LAUNCHER_18_3_9_PLAY_EXPERIMENTAL.zip'
          new='dist/MINEVORA_LAUNCHER_18_3_10_START_GLOW_EXPERIMENTAL.zip'
          with ZipFile(old) as original, ZipFile(new) as revised:
              assert revised.testzip() is None
              unchanged=set(original.namelist())-{root+'minevora_dashboard.py'}
              assert all(revised.read(name)==original.read(name) for name in unchanged)
              dashboard=revised.read(root+'minevora_dashboard.py').decode('utf-8')
              ast.parse(dashboard)
              assert "launcher.play,True" in dashboard
              assert "self._play_pulse.start()" in dashboard
              assert "launcher.install_mod_loader" in dashboard
              assert "launcher.instances" in dashboard
          print('UI-only changes verified; game engine and all other files preserved')
          PY
      - name: Upload Windows test archive
        uses: actions/upload-artifact@v4
        with:
          name: MINEVORA-18.3.10-START-GLOW-EXPERIMENTAL
          path: |
            dist/MINEVORA_LAUNCHER_18_3_10_START_GLOW_EXPERIMENTAL.zip
            dist/MINEVORA_LAUNCHER_18_3_10_START_GLOW_EXPERIMENTAL.zip.sha256
          retention-days: 30
          if-no-files-found: error
