name: Inspect MINEVORA 18.3.6 for matching desktop design
on:
  push:
    paths: ['.github/workflows/inspect-18-3-6-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh release download v18.3.6 --repo "${{ github.repository }}" --pattern 'MINEVORA_LAUNCHER_18_3_6_CZYSTY_START.zip' --dir input
          gh release download v18.3.6 --repo "${{ github.repository }}" --pattern '*.sha256' --dir input
          (cd input && sha256sum -c MINEVORA_LAUNCHER_18_3_6_CZYSTY_START.zip.sha256)
      - name: Inspect screen and theme
        run: |
          python - <<'PY'
          import zipfile,re,ast
          name='input/MINEVORA_LAUNCHER_18_3_6_CZYSTY_START.zip'
          with zipfile.ZipFile(name) as z:
            paths=[n for n in z.namelist() if n.endswith('.py') and ('dashboard' in n or 'minevora_qt' in n)]
            print('CANDIDATES',paths)
            for p in paths[:7]:
              src=z.read(p).decode('utf-8-sig')
              lines=src.splitlines()
              print('FILE',p,'lines',len(lines),'bytes',len(src),'AST',bool(ast.parse(src)))
              if p.endswith('minevora_dashboard.py'):
                print('=== DASHBOARD source first 350 lines ===')
                for i,line in enumerate(lines[:350]):
                  print(f'CODE {i+1:04d}: {line[:350]}')
                for i,line in enumerate(lines):
                  if any(s in line.lower() for s in ('background','hero','banner','setstylesheet','setminimumsize','image','pixmap','logo','qlineargradient','qlabel','setobjectname','setfixedheight')):
                    if i>=350 and i<1000:
                      print(f'THEME {i+1:04d}: {line[:350]}')
              elif p.endswith('minevora_qt.py'):
                for i,line in enumerate(lines):
                  if any(s in line for s in ('setStyleSheet(', 'def __init__', 'QStackedWidget','EnchantedDashboard','StyleSheet(', 'self.dashboard')):
                    if i<550 or 'Dashboard' in line:
                      print(f'MAIN {i+1:04d}: {line[:300]}')
          PY

      - name: Inspect real version selectors and Minecraft startup
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('input/MINEVORA_LAUNCHER_18_3_6_CZYSTY_START.zip') as z:
            lines=z.read('MINEVORA_18_3_ENCHANTED/minevora_qt.py').decode('utf-8-sig').splitlines()
          for a,b in [(407,455),(1630,1805),(1870,1910)]:
            print('=== MAIN SECTION',a,b)
            for n in range(a-1,min(len(lines),b)):
              print(f'MAINLINE {n+1:04d}: {lines[n][:430]}')
          print('=== COMBOS ===')
          for n,line in enumerate(lines):
            if any(k in line for k in ('self.version','self.loader','self.profile_combo','self.version_combo','self.loader_combo','self.install_', 'QComboBox(')):
              if n<800 or n>1600:
                print(f'COMBO {n+1:04d}: {line[:330]}')
          PY
