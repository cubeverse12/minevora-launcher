name: Test Modrinth Profile Installer

on:
  push:
    branches: [main]
    paths:
      - 'tools/modrinth_plan_installer.py'
      - 'tests/test_modrinth_plan_installer.py'
      - 'tools/microsoft_minecraft_device_auth.py'
      - 'tests/test_microsoft_device_auth.py'
      - 'tools/minevora_services_window.py'
      - '.github/workflows/test-modrinth-plan-installer.yml'
  pull_request:
    paths:
      - 'tools/modrinth_plan_installer.py'
      - 'tests/test_modrinth_plan_installer.py'
      - 'tools/microsoft_minecraft_device_auth.py'
      - 'tests/test_microsoft_device_auth.py'
      - 'tools/minevora_services_window.py'
      - '.github/workflows/test-modrinth-plan-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python source
        run: python -m py_compile tools/modrinth_plan_installer.py tests/test_modrinth_plan_installer.py tools/microsoft_minecraft_device_auth.py tests/test_microsoft_device_auth.py tools/minevora_services_window.py
      - name: Run offline compatibility and checksum tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: Install Qt for headless window smoke test
        run: python -m pip install --quiet 'PySide6>=6.8,<7'
      - name: Smoke test account and addons dialog offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from PySide6.QtWidgets import QApplication
          from minevora_services_window import MinevoraServicesWindow
          app=QApplication([])
          w=MinevoraServicesWindow()
          w.show()
          app.processEvents()
          assert w.login_btn.text() == 'Zaloguj przez Microsoft'
          assert w.check_btn.isEnabled()
          assert w.apply_btn.isEnabled()
          assert not w.open_link_btn.isEnabled()
          assert w.windowTitle().startswith('MINEVORA')
          print('QT SERVICES SMOKE OK')
          w.close()
          app.quit()
          PY
